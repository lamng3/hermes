# The paper's main grid: every method under every model, on CK26 and DB26.
# Run it all with `hermes sweep configs/sweeps/paper.yaml`, a slice with
# --only (for example --only @gpt), or list the runs with --list.
# Interrupted runs resume where they stopped.
benchmarks: [ck26, db26]
cache: .cache/llm
limits:
  query_seconds: 30     # any single SPARQL query
  item_seconds: 300     # one question, end to end

systems:
  - system: training-free
  - system: uniqgen
    params: {beam_width: 5, max_depth: 5}
  - system: algebra-agent      # Hermes without the verifier
    params: {max_steps: 15}
  - system: prover             # Hermes
    params: {max_steps: 15}
  # Ablations are more entries with a name:
  - name: prover-steps-8
    system: prover
    params: {max_steps: 8}

models:
  - name: llama3.1-8b          # local, through Ollama
    provider: ollama
    model: llama3.1
  - name: qwen2.5-7b           # any Hugging Face model on a Modal GPU (deploy/modal_vllm.py)
    provider: vllm
    model: Qwen/Qwen2.5-7B-Instruct
    base_url: ${HERMES_VLLM_URL}
  - name: gpt-4o-mini          # hosted API; reads OPENAI_API_KEY
    provider: openai
    model: gpt-4o-mini
