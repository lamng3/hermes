# Model-size study: every method on CK26 with Qwen3 at 4B, 8B, and 14B,
# each served by vLLM on a Modal L40S (deploy/modal_vllm.py), thinking off.
# 16 questions run at once so vLLM can batch their requests.
#
#   modal run experiments/modal_sweep.py --file configs/sweeps/qwen3-sizes.yaml
benchmark: ck26
concurrency: 16
cache: .cache/llm
limits:
  query_seconds: 30
  item_seconds: 300

systems:
  - system: training-free
  - system: uniqgen
    params: {beam_width: 5, max_depth: 5}
  - system: algebra-agent
    params: {max_steps: 15}
  - system: prover
    params: {max_steps: 15}

models:
  - name: qwen3-4b
    provider: vllm
    model: Qwen/Qwen3-4B
    base_url: https://lamng3-work--hermes-vllm-qwen3-4b-serve.modal.run/v1
    extra: {chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3-8b
    provider: vllm
    model: Qwen/Qwen3-8B
    base_url: https://lamng3-work--hermes-vllm-qwen3-8b-serve.modal.run/v1
    extra: {chat_template_kwargs: {enable_thinking: false}}
  - name: qwen3-14b
    provider: vllm
    model: Qwen/Qwen3-14B
    base_url: https://lamng3-work--hermes-vllm-qwen3-14b-serve.modal.run/v1
    extra: {chat_template_kwargs: {enable_thinking: false}}
