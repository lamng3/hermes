[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sparql"
version = "0.1.0"
description = "Natural language to SPARQL with pluggable systems"
authors = [
  { name = "Lam Nguyen", email = "lamng3.work@gmail.com" },
]
license = "CC-BY-4.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/lamng3/hermes"

[tool.pytest.ini_options]
testpaths = ["tests"]
