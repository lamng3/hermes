[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sparql"
version = "0.1.0"
description = "Training-free natural language to SPARQL generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nl2sparql = "nl2sparql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
